workflows:
  android-build:
    name: Android APK Build
    max_build_duration: 60
    environment:
      android_signing:
        - debug_keystore
      vars:
        PACKAGE_NAME: "com.example.pharma_stock_manager"
    scripts:
      - name: Build APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk